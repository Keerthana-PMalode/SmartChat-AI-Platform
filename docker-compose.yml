services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - chatbot-project_postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./postgres/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

    restart: unless-stopped

    networks:
      - chatbot_network


  auth:
    build:
      context: ./auth_service
      dockerfile: Dockerfile

    env_file:
      - ./.env

    volumes:
      - ./auth_service:/app

    depends_on:
      - postgres

    restart: unless-stopped

    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set} 

    networks:
      - chatbot_network


  file_service:
    build:
      context: ./file_service
      dockerfile: Dockerfile

    env_file:
      - ./.env

    environment:
      DATABASE_URL: ${DATABASE_URL}

    volumes:
      - ./file_service/uploads:/app/uploads

    depends_on:
      - postgres

    restart: unless-stopped

    networks:
      - chatbot_network

  rasa_sdk:
    build:
      context: ./rasa_sdk
      dockerfile: Dockerfile

    env_file:
      - ./.env

    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}

    volumes:
      - ./rasa_sdk/actions:/app/actions

    command: start --actions actions

    restart: unless-stopped

    depends_on:
      - auth

    networks:
      - chatbot_network


  rasa:
    build:
      context: ./rasa
      dockerfile: Dockerfile

    env_file:
      - ./.env

    volumes:
      - ./rasa:/app
      - chatbot-project_rasa_models:/app/models

    command: >
      run
      --enable-api
      --cors "*"
      --debug
      --endpoints endpoints.yml
      -i 0.0.0.0
      -p 5006

    depends_on:
      - rasa_sdk

    restart: unless-stopped

    networks:
      - chatbot_network


  nginx:
    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - rasa
      - auth
      - file_service
      

    restart: unless-stopped

    networks:
      - chatbot_network

volumes:
  chatbot-project_postgres_data:
    external: true

  chatbot-project_rasa_models:
    external: true

networks:
  chatbot_network:
    driver: bridge
